<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            height: 500px;
            background-color: antiquewhite;
            display: flex;
            /* align-content: stretch; */
            /* justify-content: center; */
            /* align-items: center; */
            /* flex-direction: row-reverse; */
        }

        .items {
            width: 200px;
            height: 100px;
            border: 1px solid red;
        }

        .box1 {
            background-color: chartreuse;
        }

        .box2 {
            background-color: coral;
        }

        .box3 {
            background-color: cornflowerblue;
        }

        .box4 {
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="items box1">box1</div>
        <div class="items box2">box2</div>
        <div class="items box3">box3</div>
        <div class="items box4">box4</div>
    </div>
</body>

</html>
