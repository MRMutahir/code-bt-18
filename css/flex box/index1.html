<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            height: 600px;
            border: 1px solid black;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            justify-content: space-between;
            justify-content: space-evenly;
            /* justify-content: center; */
            /* justify-content: flex-end; */
            /* align-items: flex-end; */
            /* flex-wrap: wrap; */

        }

        .items {
            width: 200px;
            height: 100px;
            border: 1px solid black;
            margin: 5px;
            padding: 10px;
        }

        #items1 {
            background-color: blueviolet;
            order: 5;
            align-self: flex-end;
            margin-bottom: 100px;
        }

        #items2 {
            background-color: coral;
            flex-grow: 2;
            align-self: center;
        }

        #items3 {
            background-color: chartreuse;
            order: 4;
            flex-shrink: 3;
        }

        #items4 {
            background-color: darkgoldenrod;
            flex-grow: 3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="items" id="items1">items1</div>
        <div class="items" id="items2">items2</div>
        <div class="items" id="items3">items3</div>
        <div class="items" id="items4">items4</div>
    </div>
</body>

</html>
