<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Profile Card UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f2f4f8;
        }

        .profile-card {
            width: 360px;
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            border: 4px solid #eee;
        }

        .profile-name {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #222;
        }

        .profile-intro {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .profile-actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }

        .profile-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-edit {
            background: #4f46e5;
            color: #fff;
        }

        .btn-photo {
            background: #e5e7eb;
            color: #111;
        }
    </style>
</head>

<body>

    <div class="profile-card">
        <img src="" alt="Profile Image" class="profile-img" />

        <h2 class="profile-name">example name</h2>

        <p class="profile-intro">
            example intro
        </p>
        <div class="profile-actions">
            <button class="btn-back">Back Profile</button>
            <button class="btn-next">Next Profile</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
